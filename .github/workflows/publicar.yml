name: publicar

# Al publicar una Release (gh release create vX.Y.Z), valida y adjunta los zips
# por skill. Si ya estaban adjuntos, los sustituye.
on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  publicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Dependencias y pruebas de regresión
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m unittest discover -s tests -v
      - name: Versión de la Release
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          version = json.loads(Path('dacuotas/plugin.json').read_text())['version']
          if os.environ['RELEASE_TAG'] != f'v{version}':
              raise SystemExit('El tag debe coincidir con la versión del plugin: v' + version)
          PY
      - name: Validar
        env:
          PALABRAS_PROHIBIDAS: ${{ secrets.PALABRAS_PROHIBIDAS }}
        run: |
          bash comprobar.sh
          npm install -g @anthropic-ai/claude-code
          claude plugin validate .
          claude plugin validate ./dacuotas
      - name: Zips a la Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          bash empaquetar.sh
          gh release upload "$RELEASE_TAG" dist/*.zip dist/SHA256SUMS --clobber
